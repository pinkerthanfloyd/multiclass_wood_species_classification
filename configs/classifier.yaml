# Clasificador de especie — configuracion de la ejecucion reportada
#
# DOCUMENTACION, NO CONFIGURACION EJECUTABLE: species_classifier.py todavia lleva
# estos valores en constantes de cabecera. Este fichero existe para que los
# resultados publicados sean auditables y como base del refactor pendiente.

entradas:
  especies_json: models/inferences/especies.json     # id de 4 digitos -> nombre latino
  coco_predicciones: models/inferences/sem_loss_stratified

salidas:
  features: species_inferences/features_por_imagen.csv
  predicciones_out_of_fold: species_inferences/predictions.csv
  reporte: species_inferences/classification_report.txt
  modelo_rf: models/species_classifier/species_model_rf.joblib
  modelo_svm: models/species_classifier/species_model_svm.joblib

features:
  # Por cada una de las 14 clases de rasgo: _count, _area_sum, _area_mean,
  # _area_std, _density_%.  Mas total_annotations, total_annotated_area,
  # total_density_%.  Se descartan image_id, file_name, species_id,
  # species_name e img_area.
  columnas_por_clase: [count, area_sum, area_mean, area_std, "density_%"]
  agregados: [total_annotations, total_annotated_area, "total_density_%"]

validacion:
  esquema: StratifiedKFold
  n_splits: 5
  shuffle: true
  random_state: 42
  metricas: [accuracy, f1_macro]
  # Pendiente: agrupar por especimen fisico (GroupKFold). Varias imagenes son
  # cortes de la misma pieza y ahora pueden caer en pliegues distintos.

modelos:
  random_forest:
    imputer: median
    n_estimators: 500
    max_depth: null
    min_samples_leaf: 2
    class_weight: balanced
    random_state: 42
  svm:
    imputer: median
    scaler: StandardScaler
    kernel: rbf
    C: 10
    gamma: scale
    class_weight: balanced
    probability: true
    random_state: 42

seleccion_de_modelo:
  criterio_declarado: f1_macro
  # BUG CONOCIDO: el script sobrescribe la seleccion con SVM de forma
  # incondicional. En la ejecucion publicada gano el RF (0.9646) pero se guardo
  # la SVM (0.9364). Ver results/RESULTS.md, seccion 2.

